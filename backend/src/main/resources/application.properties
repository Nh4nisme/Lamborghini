spring.config.import= optional:file:.env[.properties]

server.port= ${PORT:8080}
spring.datasource.url= ${DB_URL}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Spring AI - Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.max-output-tokens=2048

# Embedding Gemini cho Vector Store
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# MariaDB Vector Store (bắt buộc): số chiều phải bằng số chiều embedding ở trên
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.table-name=vector_store
spring.ai.vectorstore.mariadb.dimensions=768
spring.ai.vectorstore.mariadb.distance-type=COSINE

# Lập chỉ mục dữ liệu và tìm kiếm trong Vector Store
app.ai.index-on-startup=true
app.ai.rag.top-k=5
app.ai.rag.similarity-threshold=0.7
